<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<title>Como rezar o terço · Sete Rosas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Karla:wght@400;500;700&display=swap">
<style>
/* Tudo numa só página A4: em cima a imagem de como se reza e os mistérios lado a lado;
   em baixo as orações, português à esquerda e latim à direita, cada uma ao lado da sua tradução. */
@page{size:210mm 297mm;margin:0}
:root{--ink:#4b4038;--muted:#85786b;--gold:#9a7843;--gold-soft:#d9c39b;--rose:#b56f7f;--cream:#fdf9f3;--paper:#fffdf9}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"Karla",Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;background:var(--cream);padding:13mm 14mm 12mm;display:flex;flex-direction:column;align-items:center}
.page::before{content:"";position:absolute;inset:4.5mm;border:0.5mm solid var(--gold-soft);border-radius:5mm;pointer-events:none}
.page::after{content:"";position:absolute;inset:6.2mm;border:0.2mm solid var(--gold-soft);border-radius:4mm;pointer-events:none}
.c{position:absolute;color:var(--gold-soft);font-size:13pt;line-height:1}
.c.tl{top:7.6mm;left:8mm}.c.tr{top:7.6mm;right:8mm;transform:scaleX(-1)}
.c.bl{bottom:7.6mm;left:8mm;transform:scaleY(-1)}.c.br{bottom:7.6mm;right:8mm;transform:scale(-1,-1)}
h1,h2,h3{font-family:"IM Fell English",Georgia,serif;font-weight:400;margin:0;color:var(--gold);text-align:center}
h1{font-size:24pt;line-height:1}
h2{font-size:13pt;margin-bottom:2mm}

.topo{display:grid;grid-template-columns:96mm 1fr;gap:6mm;align-items:center;width:100%;margin-top:4mm}
.como{width:96mm;height:auto;display:block;
  -webkit-mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 97%,transparent);-webkit-mask-composite:source-in;
  mask-image:linear-gradient(to right,transparent,#000 6%,#000 94%,transparent),linear-gradient(to bottom,transparent,#000 3%,#000 97%,transparent);mask-composite:intersect}
.mist{display:grid;gap:3.2mm;text-align:center}
.grupo h3{color:var(--rose);font-size:12pt;line-height:1}
.grupo .exp{font-size:7.2pt;margin:0.6mm 0 0}
.grupo .dias{font-size:6.8pt;color:var(--muted);font-style:italic;margin:0.2mm 0 1mm}
.grupo ol{margin:0;padding:0;list-style:none;display:inline-grid;gap:0.3mm;text-align:left;font-size:7.4pt;line-height:1.26}
.grupo li{display:grid;grid-template-columns:5mm 1fr}
.grupo li span{font-family:"IM Fell English",Georgia,serif;color:var(--gold)}
.grupo + .grupo::before{content:"✿";display:block;color:var(--gold-soft);font-size:7pt;margin-bottom:1.6mm}

.sep{color:var(--gold-soft);font-family:"IM Fell English",Georgia,serif;letter-spacing:.6em;padding-left:.6em;font-size:9pt;margin:4mm 0 2.4mm}
.oracoes{width:100%;display:grid;grid-template-columns:1fr 1fr;column-gap:7mm;row-gap:2mm}
.oracoes .cab{font-family:"IM Fell English",Georgia,serif;color:var(--rose);text-align:center;font-size:10pt;border-bottom:0.2mm solid var(--gold-soft);padding-bottom:0.8mm}
.or{font-size:7.1pt;line-height:1.3;margin:0;text-align:center}
.or b{display:block;font-family:"IM Fell English",Georgia,serif;font-weight:400;color:var(--gold);font-size:8.6pt;margin-bottom:0.2mm}
.or[lang="la"]{font-style:italic}
.or[lang="la"] b{font-style:normal}
.fim{margin-top:auto;text-align:center;font-family:"IM Fell English",Georgia,serif;font-style:italic;color:var(--gold);font-size:9pt}
.fim small{display:block;font-family:"Karla",Arial,sans-serif;font-style:normal;font-size:6.6pt;letter-spacing:.18em;text-transform:uppercase;color:var(--rose);font-weight:700;margin-top:0.6mm}
@media screen{html,body{background:#efe6d6}body{padding:24px 0;display:flex;justify-content:center}.page{box-shadow:0 8px 28px rgba(75,64,56,.18);border-radius:6mm}}
.page{padding:11mm 13mm 10mm !important}
h1{font-size:21pt !important}
.topo{grid-template-columns:84mm 1fr !important;margin-top:2.4mm !important;gap:5mm !important}
.como{width:84mm !important}
.mist{gap:1.8mm !important}
h2{font-size:12pt !important;margin-bottom:1mm !important}
.grupo h3{font-size:11pt !important}
.grupo .exp{font-size:6.8pt !important}
.grupo .dias{font-size:6.4pt !important;margin:0 0 0.6mm !important}
.grupo ol{font-size:6.9pt !important;line-height:1.22 !important}
.grupo + .grupo::before{margin-bottom:1mm !important}
.sep{margin:2.4mm 0 1.4mm !important}
.oracoes{row-gap:1.3mm !important}
.or{font-size:6.55pt !important;line-height:1.26 !important}
.or b{font-size:8pt !important}
</style>
</head>
<body>
<section class="page">
  <span class="c tl">❦</span><span class="c tr">❦</span><span class="c bl">❦</span><span class="c br">❦</span>
  <h1>O Santo Terço</h1>
  <div class="topo">
    <img class="como" src="img/como-rezar.jpg" alt="">
    <div class="mist">
      <h2>Os mistérios</h2>
      __MISTERIOS__
    </div>
  </div>
  <p class="sep">✠ ✠ ✠</p>
  <div class="oracoes">
    <p class="cab">As orações</p><p class="cab">Em latim</p>
__ORACOES__
  </div>
  <p class="fim">Um terço de cada vez, até à paz no mundo.<small>seterosas.pt</small></p>
</section>
</body>
</html>
